  <text x="40" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">3-Tier Pluggable Multi-Agent Architecture</text>
  <text x="40" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#94A3B8">Any tier can be hot-swapped via config.env without altering project structures or safety guardrails</text>

  <!-- TIER 1 BOX -->
  <rect x="40" y="84" width="1020" height="106" rx="14" fill="#0F172A" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="58" y="100" width="210" height="24" rx="6" fill="#0369A1"/>
  <text x="163" y="116" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">TIER 1 · COMMAND &amp; INTAKE</text>

  <g transform="translate(58, 134)">
    <rect x="0" y="0" width="225" height="40" rx="8" fill="#1E293B" stroke="#38BDF8"/>
    <text x="112" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#E0F2FE">Muse (Voice / Desktop Lead)</text>

    <rect x="245" y="0" width="225" height="40" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="357" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">Orca Mobile (Tailscale Relay)</text>

    <rect x="490" y="0" width="225" height="40" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="602" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">Claude Desktop / Cowork</text>

    <rect x="735" y="0" width="248" height="40" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="859" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">OpenClaw / Webhook / CLI</text>
  </g>

  <!-- Arrow Tier 1 -> Tier 2 -->
  <line x1="550" y1="190" x2="550" y2="218" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowCyan)"/>

