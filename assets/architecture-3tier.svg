    <text x="16" y="48" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#C4B5FD">· orca worktree / terminal</text>
    <text x="16" y="68" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#C4B5FD">· Multi-Account Auto-Failover</text>

    <rect x="248" y="0" width="232" height="84" rx="10" fill="#1E1B4B" stroke="#7C3AED"/>
