    <text x="364" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#6EE7B7">Audits, Tests &amp; Multi-Account Pool</text>

    <rect x="496" y="0" width="232" height="44" rx="8" fill="#112E2A" stroke="#10B981"/>
    <text x="612" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ECFDF5">Google Antigravity</text>
    <text x="612" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#6EE7B7">Full-Repo Search &amp; Orchestration</text>

    <rect x="744" y="0" width="240" height="44" rx="8" fill="#112E2A" stroke="#10B981"/>
    <text x="864" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ECFDF5">DeepSeek / OpenCode / Cursor</text>
    <text x="864" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#6EE7B7">Fast Scripts &amp; Auxiliary Tasks</text>
  </g>

  <!-- Storage & Toolchain Row -->
  <g transform="translate(58, 518)">
    <rect x="0" y="0" width="480" height="48" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="16" y="20" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#38BDF8">${AI_VOLUME_PATH}/AI/{Projects,Worktrees,Archive,Data}</text>
    <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">Hardware UUID Verified · Single Main Clone · Isolated Worktrees</text>

    <rect x="496" y="0" width="488" height="48" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="512" y="20" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#FBBF24">~/.local/bin Native CLI + Xcode MCP Bridge</text>
    <text x="512" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">rg · fd · ast-grep · just · xcbeautify · repomix · scc · Simulator Lease</text>
