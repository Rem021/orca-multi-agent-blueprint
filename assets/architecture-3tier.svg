    <text x="264" y="48" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#C4B5FD">· sync_profiles.py</text>
    <text x="264" y="68" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#C4B5FD">· Unified Skills, Rules &amp; MCP</text>

    <rect x="496" y="0" width="232" height="84" rx="10" fill="#1E1B4B" stroke="#7C3AED"/>
    <text x="512" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#EDE9FE">PreToolUse Safety Guard</text>
    <text x="512" y="48" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#FCA5A5">· ~/.local/bin/agent-guard</text>
    <text x="512" y="68" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#C4B5FD">· Blocks rm -rf / reset --hard</text>

    <rect x="744" y="0" width="240" height="84" rx="10" fill="#1E1B4B" stroke="#7C3AED"/>
    <text x="760" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#EDE9FE">Zero-Token Naming Plugin</text>
    <text x="760" y="48" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#C4B5FD">· orca-naming-guard</text>
    <text x="760" y="68" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#C4B5FD">· Project｜SpecificTopic</text>
  </g>

  <!-- Arrow Tier 2 -> Tier 3 -->
  <line x1="550" y1="378" x2="550" y2="406" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrowPurple)"/>

