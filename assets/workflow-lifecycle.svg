<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" width="100%" height="auto">
  <defs>
    <linearGradient id="bgPipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrowStep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1100" height="260" rx="16" fill="url(#bgPipe)" stroke="#1E293B" stroke-width="2"/>

  <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">5-Stage Deterministic Task &amp; Worktree Lifecycle</text>
  <text x="36" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">Every task follows an auditable pipeline from isolated worktree creation to cryptographic archival</text>

  <!-- Step 1 -->
  <g transform="translate(32, 78)">
    <rect x="0" y="0" width="192" height="150" rx="12" fill="#131C31" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#0284C7"/>
    <text x="28" y="33" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFF">1</text>
    <text x="50" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Worktree Spawn</text>
    <text x="16" y="62" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#38BDF8">projectctl.py new</text>
    <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">· Verifies SSD UUID</text>
    <text x="16" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">· Branches from main</text>
    <text x="16" y="124" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">· Auto-titled in Orca</text>
  </g>

  <line x1="228" y1="153" x2="244" y2="153" stroke="#64748B" stroke-width="2" marker-end="url(#arrowStep)"/>

  <!-- Step 2 -->
  <g transform="translate(248, 78)">
    <rect x="0" y="0" width="192" height="150" rx="12" fill="#17153B" stroke="#7C3AED" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#7C3AED"/>
    <text x="28" y="33" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFF">2</text>
    <text x="50" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Guarded Coding</text>
    <text x="16" y="62" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#C4B5FD">agent-guard + ast-grep</text>
    <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">· PreToolUse intercepts</text>
    <text x="16" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">· Shared SPM cache</text>
    <text x="16" y="124" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">· Sim lease lock check</text>
  </g>

  <line x1="444" y1="153" x2="460" y2="153" stroke="#64748B" stroke-width="2" marker-end="url(#arrowStep)"/>

  <!-- Step 3 -->
  <g transform="translate(464, 78)">
    <rect x="0" y="0" width="192" height="150" rx="12" fill="#1E1B2E" stroke="#EC4899" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#DB2777"/>
    <text x="28" y="33" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFF">3</text>
    <text x="50" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Compact Handoff</text>
    <text x="16" y="62" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#F472B6">just handoff</text>
    <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">· Base/Head Git SHAs</text>
    <text x="16" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">· File SHA-256 digests</text>
    <text x="16" y="124" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">· -80% context tokens</text>
  </g>

  <line x1="660" y1="153" x2="676" y2="153" stroke="#64748B" stroke-width="2" marker-end="url(#arrowStep)"/>

  <!-- Step 4 -->
  <g transform="translate(680, 78)">
    <rect x="0" y="0" width="192" height="150" rx="12" fill="#1F2418" stroke="#EAB308" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#CA8A04"/>
    <text x="28" y="33" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFF">4</text>
    <text x="50" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Cross-Review</text>
    <text x="16" y="62" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#FDE047">Claude ↔ Codex Audit</text>
    <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">· Hub-and-Spoke model</text>
    <text x="16" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">· Evidence vs Inference</text>
    <text x="16" y="124" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">· Merge to clean main</text>
  </g>

  <line x1="876" y1="153" x2="892" y2="153" stroke="#64748B" stroke-width="2" marker-end="url(#arrowStep)"/>

  <!-- Step 5 -->
  <g transform="translate(896, 78)">
    <rect x="0" y="0" width="172" height="150" rx="12" fill="#0D2824" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#059669"/>
    <text x="28" y="33" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFF">5</text>
    <text x="50" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Safe Archive</text>
    <text x="16" y="62" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#6EE7B7">AI/Archive/</text>
    <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">· git bundle --all</text>
    <text x="16" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">· snapshot.tar.gz</text>
    <text x="16" y="124" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">· SHA256SUMS.txt</text>
  </g>
</svg>
