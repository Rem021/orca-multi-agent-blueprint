<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>
  <rect width="1200" height="380" rx="20" fill="url(#grid)" opacity="0.55"/>

  <!-- Top Glow Bar -->
  <rect x="60" y="0" width="1080" height="4" rx="2" fill="url(#accentCyan)"/>

  <!-- Left Hero Title Block -->
  <g transform="translate(60, 56)">
    <rect x="0" y="0" width="230" height="28" rx="14" fill="#0F2942" stroke="#0284C7" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#38BDF8"/>
    <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#7DD3FC" letter-spacing="0.6">MACOS MULTI-AGENT BLUEPRINT</text>

    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC">Orca Multi-Agent</text>
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#38BDF8">Orchestration Blueprint</text>

    <text x="0" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="15" fill="#94A3B8">Pluggable 3-Tier Architecture · 180+ Git Worktree Governance</text>
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="15" fill="#94A3B8">Zero-Config One-Line Deployment · Deterministic Safety Guardrails</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="142" height="32" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="71" y="21" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#38BDF8">Tier-1: Muse / Any</text>

      <rect x="154" y="0" width="142" height="32" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="225" y="21" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A78BFA">Tier-2: Orca Hub</text>

      <rect x="308" y="0" width="166" height="32" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="391" y="21" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#34D399">Tier-3: 4+ CLI Agents</text>
    </g>

    <!-- Command Bar -->
    <g transform="translate(0, 256)">
      <rect x="0" y="0" width="474" height="40" rx="8" fill="#090D16" stroke="#1E293B" stroke-width="1.5"/>
      <text x="16" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#10B981">$</text>
      <text x="32" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#E2E8F0">curl -fsSL .../bootstrap.sh | zsh</text>
      <rect x="382" y="8" width="80" height="24" rx="5" fill="#064E3B"/>
      <text x="422" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7">AUTO-SETUP</text>
    </g>
  </g>

  <!-- Right Visual Stack Diagram -->
  <g transform="translate(590, 38)">
    <!-- Tier 1 Card -->
    <rect x="0" y="0" width="550" height="76" rx="12" fill="#131C31" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="16" y="16" width="84" height="22" rx="6" fill="#0284C7"/>
    <text x="58" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">TIER 1</text>
    <text x="114" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Pluggable Front-End Supervisor</text>
    <text x="114" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#94A3B8">Muse · Orca Mobile · Claude Desktop · OpenClaw</text>

    <!-- Connector 1 -> 2 -->
    <path d="M 275 76 L 275 104" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="275,108 270,100 280,100" fill="#38BDF8"/>

    <!-- Tier 2 Card -->
    <rect x="0" y="110" width="550" height="88" rx="12" fill="#17153B" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="16" y="126" width="84" height="22" rx="6" fill="#7C3AED"/>
    <text x="58" y="141" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">TIER 2</text>
    <text x="114" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Orca Control Plane &amp; Deterministic Governance</text>
    <text x="114" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#C4B5FD">sync_profiles.py · agent-guard (PreToolUse) · orca-naming-guard</text>
    <text x="114" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94A3B8">Multi-Account Failover · Zero-Token Title Sync · Simulator Leases</text>

    <!-- Connector 2 -> 3 -->
    <path d="M 275 198 L 275 226" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="275,230 270,222 280,222" fill="#8B5CF6"/>

    <!-- Tier 3 Card -->
    <rect x="0" y="232" width="550" height="76" rx="12" fill="#0D2824" stroke="#10B981" stroke-width="1.5"/>
    <rect x="16" y="248" width="84" height="22" rx="6" fill="#059669"/>
    <text x="58" y="263" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">TIER 3</text>
    <text x="114" y="264" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Isolated Worker Fleet &amp; External SSD Taxonomy</text>
    <text x="114" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#6EE7B7">Claude Code · Codex · Antigravity · DeepSeek · /Volumes/AI_Workspace</text>
  </g>
</svg>
