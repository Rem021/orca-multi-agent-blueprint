name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (macOS, Python ${{ matrix.python-version }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the system Python of macOS; 3.x is the newest stable release
        python-version: ["3.9", "3.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Shell syntax
        run: |
          for f in bootstrap.sh deploy.sh scripts/install_cli_tools.sh scripts/codex-storage/*.sh; do
            zsh -n "$f"
          done

      - name: Test suite
        run: python -B -m unittest discover -s tests -v
